<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#202735" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./public/icons/apple-touch-icon.png" />
    <link rel="icon" href="./public/assets/ling.svg" />
    <link rel="stylesheet" href="./production.css" />
    <title>Erin Math Lab · 学习搭档</title>
  </head>
  <body>
    <header class="site-header">
      <a href="./" class="brand"
        ><span class="logo">✦</span
        ><span>ERIN MATH LAB<small>三科学习 / 搭档航站</small></span></a
      >
      <nav aria-label="主要导航">
        <button data-view="home">航站</button
        ><button data-view="collection">搭档图鉴</button
        ><button data-view="progress">进度</button
        ><button data-view="reports">家长报告</button
        ><button data-view="settings">设置</button>
      </nav>
    </header>
    <div id="notice" role="status" hidden></div>
    <main id="main"></main>
    <footer>
      <span>v1.3.0 · 只在本机保存 · 广州学习日期</span
      ><span id="offline" role="status">正在检查离线资源…</span
      ><button id="cacheRetry" hidden>重试离线缓存</button
      ><button id="update" hidden>发现新版本 · 完成后更新</button>
    </footer>
    <dialog id="dialog">
      <div id="dialogBody"></div>
      <button id="closeDialog">关闭</button>
    </dialog>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
